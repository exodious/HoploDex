# The pull request description's required sections (constitution, Development
# Workflow & Quality Gates): every pull request carries a "## Security review",
# and one that changes anything under src/ (the UI) carries "## Screenshots"
# with its before/after shots. The security review section carries the lines
# /ai-security-review's pull request run prints (BODY in
# scripts/ai-security-review.mjs): the reviewed commit, the counts uploaded to
# code scanning, and "Attack surface: unchanged" or "changed"; a changed
# surface needs this pull request to update docs/attack-surface.md. The lines
# never describe a finding. The Claude hook .claude/hooks/pr-security-review.sh
# warns early, but only for a PR opened through Claude's Bash tool; this check
# holds whoever opens the PR. It runs again on "edited", since the description
# may be filled in after the PR opens.
#
# Only Dependabot's pull requests are exempt, since Dependabot can't write a
# review. They skip by step rather than by a job-level `if`, so the check
# always reports a result if it is made required.
name: PR description

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sections:
    name: PR description
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      # The body comes in through the environment, never the script text, so
      # nothing in it can run. The file list is the API's (no checkout); a
      # renamed file counts under both names, so moving a file out of src/
      # still needs screenshots.
      - name: Check the description's sections
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        # Here-strings, not `printf | grep -q`: under pipefail, grep quitting
        # early can fail the pipeline on printf's SIGPIPE.
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "::notice::Dependabot's pull request is exempt."
            exit 0
          fi

          changed=$(gh api --paginate "repos/$REPO/pulls/$NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          printf 'Changed files:\n%s\n' "$changed"

          body=$(tr -d '\r' <<<"$BODY")
          has() { grep -q -i -E "^[[:space:]]*##[[:space:]]+$1([^[:alnum:]]|\$)" <<<"$body"; }
          failed=0
          if ! has 'Security review'; then
            echo "::error::The description has no \"## Security review\" section."
            failed=1
          else
            # From the heading to the next # or ## heading.
            section=$(awk '
              tolower($0) ~ /^[ \t]*##[ \t]+security review([^a-z0-9]|$)/ { s = 1; next }
              s && /^[ \t]*##?[ \t]/ { s = 0 }
              s { print }' <<<"$body")
            # `|| true`: no match isn't an error here, and set -e would stop on it.
            line() { grep -m1 -E "^[[:space:]]*([-*][[:space:]]+)?$1[[:space:]]*\$" <<<"$section" || true; }
            reviewed=$(line 'Reviewed commit: [0-9a-f]{40}')
            surface=$(line 'Attack surface: (unchanged|changed)')
            if [ -z "$reviewed" ]; then
              echo "::error::The security review section has no \"Reviewed commit: <full sha>\" line: run /ai-security-review pr and copy its lines."
              failed=1
            elif ! grep -q "$HEAD_SHA" <<<"$reviewed"; then
              echo "::warning::The security review isn't of the head, ${HEAD_SHA:0:7}: review the commits since, and update the section."
            fi
            if [ -z "$(line 'Findings uploaded to code scanning: [0-9]+ \(critical [0-9]+, high [0-9]+, medium [0-9]+, low [0-9]+\)')" ]; then
              echo "::error::The security review section has no \"Findings uploaded to code scanning: …\" line."
              failed=1
            fi
            if [ -z "$surface" ]; then
              echo "::error::The security review section has no \"Attack surface: unchanged\" or \"Attack surface: changed\" line."
              failed=1
            elif grep -q 'Attack surface: changed' <<<"$surface" && ! grep -qx 'docs/attack-surface.md' <<<"$changed"; then
              echo "::error::The review says the attack surface changed, so this pull request must update docs/attack-surface.md."
              failed=1
            fi
          fi
          if grep -q '^src/' <<<"$changed" && ! has 'Screenshots'; then
            echo "::error::This pull request changes src/, so its description needs a \"## Screenshots\" section with before/after screenshots."
            failed=1
          fi
          exit "$failed"
