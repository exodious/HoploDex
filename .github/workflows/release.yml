# The release workflow (#19): on a `v*` tag it checks the release, builds every
# published package from a clean release build, runs the release-time checks,
# and opens a draft GitHub release with the packages and their checksums. A
# person publishes the draft. RELEASING.md is the written process around it.
#
# A final tag (no suffix) whose commit has a published release candidate of
# its version promotes that candidate instead: the review and the dependency
# audit run, nothing is built, and the promote job drafts the release from the
# candidate's own files and SHA256SUMS. A final tag with no published candidate
# builds as above. The review job's "Choose the path" step decides, and says
# which in the run's summary.
#
# - The tag's commit must have had the release's AI security review: its
#   upload to code scanning for exactly that commit, on main, whose head the
#   commit still is, with no critical or high code scanning alert open
#   there (constitution, Development Workflow & Quality Gates;
#   scripts/ai-security-review.mjs `reviewed`), and no critical or high
#   Dependabot alert open.
# - The per-PR CI (ci.yml) runs again on the tag, with `release` set: E2E
#   against the shipping profile on all three OSes, both Flatpak checks, and
#   the package jobs, which keep the Windows NSIS installer, the macOS .dmg, the
#   Linux .deb and .rpm (built on ubuntu-24.04) and the Flatpak as artifacts.
# - Here only: the dependency audit, import_largest_test, and the PDF surface,
#   window controls and drop checks on each OS.
#
# A tag with a pre-release suffix (`v0.1.0-rc.1`) drafts a GitHub pre-release.
# The draft stays a draft, never marked latest, until a person publishes it.
#
# Run by hand (workflow_dispatch) on a branch, it is a dry run: every job but
# the draft, with the tag check skipped and the review check reporting
# without failing the run. With `rehearse` set to a published release's tag
# (v0.1.0), it rehearses promotion against that release instead: every check
# of its files, but no draft. GitHub dispatches it only from a branch where this
# file exists, so the first dry run is on main once it has merged.
# Nothing is signed beyond the macOS build's own ad-hoc signature, which
# ci.yml's macOS package job checks. A failed job can be re-run; the draft is
# opened only when every job passed, and a re-run replaces its files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rehearse:
        description: "A published release's tag, such as v0.1.0, to rehearse promotion against (it drafts nothing)"
        type: string
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  review:
    name: Release review
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
      vulnerability-alerts: read
    outputs:
      path: ${{ steps.path.outputs.path }}
      candidate: ${{ steps.path.outputs.candidate }}
      commit: ${{ steps.path.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The Dockerfile's NODE_VERSION, as in .github/actions/setup; moved by
      # hand with it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      # The tag is v<version>[-<suffix>], as scripts/release.mjs makes it, and
      # names the version the app carries, whose migration records (every step
      # in MIGRATIONS, and the stored database) are merged before the release
      # candidate, so an accepted candidate's commit takes the final tag
      # unchanged (RELEASING.md, step 2). `release.mjs tag-check` is the check
      # its `tag` step makes too. The later jobs rely on the tag having that form.
      - name: Check the tag against the version and the migration records
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::$TAG isn't v<version> or v<version>-<suffix>"; exit 1; }
          node scripts/release.mjs tag-check "${TAG#v}" || {
            echo "::error::$TAG fails the tag check (above)"; exit 1; }

      # build: the build, test and surface jobs, then the draft job. promote:
      # the audit, then the promote job. Only published releases count, so a
      # candidate's draft is never promoted.
      - name: Choose the path
        id: path
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REHEARSE: ${{ inputs.rehearse }}
        run: |
          if [[ -n "$REHEARSE" ]]; then
            out=$(node scripts/release.mjs path "${REHEARSE#v}" --rehearsal)
          elif [[ "$EVENT" == push ]]; then
            out=$(node scripts/release.mjs path "${TAG#v}" --commit "$(git rev-parse 'HEAD^{commit}')")
          else
            out=$'path=build\nsummary=A dry run: it builds, and drafts nothing.'
          fi
          echo "$out" >> "$GITHUB_OUTPUT"
          sed -n 's/^summary=//p' <<< "$out" | tee -a "$GITHUB_STEP_SUMMARY"

      # The commit checked out, the tag's own. A dry run reports whether the
      # commit could be released without failing on the commit it ran on.
      - name: Check the release's AI security review
        continue-on-error: ${{ github.event_name != 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ai-security-review.mjs reviewed --commit "$(git rev-parse 'HEAD^{commit}')"

  ci:
    name: CI
    needs: review
    if: needs.review.outputs.path == 'build'
    uses: ./.github/workflows/ci.yml
    with:
      release: true
    permissions:
      contents: read

  # Both paths: the audit's result changes with time, not with the code.
  checks:
    name: Release checks
    needs: review
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # The Dockerfile's version, as audit.yml has it.
      CARGO_DENY_VERSION: 0.20.2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux packages
        uses: ./.github/actions/apt
        with:
          sets: build
      - uses: ./.github/actions/setup
      # v2.90.5, as .github/actions/setup has it for cargo-nextest.
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}

      - name: Dependency audit
        run: npm run audit
      # docs/development/testing.md, "Release-only tests".
      - name: import_largest_test
        if: needs.review.outputs.path == 'build'
        env:
          CARGO_PROFILE_RELEASE_PANIC: unwind
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --test import_largest_test -- --ignored --nocapture

  linux-surface:
    name: Surface checks (Linux)
    needs: review
    if: needs.review.outputs.path == 'build'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux packages
        uses: ./.github/actions/apt
        with:
          sets: build e2e
      - uses: ./.github/actions/setup
      # docs/development/surface-checks.md. Each keeps its log in
      # e2e/screenshots-out/, kept below whatever happened.
      - name: PDF surface check
        run: scripts/pdf-surface-check.sh
      - name: Window controls check
        if: success() || failure()
        run: scripts/window-controls-check.sh
      - name: Drop check
        if: success() || failure()
        run: scripts/drop-check.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surface-checks-linux
          path: e2e/screenshots-out/
          if-no-files-found: ignore

  windows-surface:
    name: Surface checks (Windows)
    needs: review
    if: needs.review.outputs.path == 'build'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set the display
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - uses: ./.github/actions/setup
      - name: PDF surface check
        run: powershell -ExecutionPolicy Bypass -File scripts\windows\pdf-surface-check.ps1
      - name: Window controls check
        if: success() || failure()
        run: powershell -ExecutionPolicy Bypass -File scripts\windows\window-controls-check.ps1
      - name: Drop check
        if: success() || failure()
        run: powershell -ExecutionPolicy Bypass -File scripts\windows\drop-check.ps1
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surface-checks-windows
          path: e2e/screenshots-out/
          if-no-files-found: ignore

  macos-surface:
    name: Surface checks (macOS)
    needs: review
    if: needs.review.outputs.path == 'build'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    # The scripts run the check here, as they do inside the test VM.
    env:
      HOPLODEX_PDF_CHECK_IN_VM: "1"
      HOPLODEX_WINDOW_CHECK_IN_VM: "1"
      HOPLODEX_DROP_CHECK_IN_VM: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set the display
        run: |
          brew install displayplacer
          id=$(displayplacer list | sed -n 's/^Persistent screen id: //p' | head -n 1)
          [ -n "$id" ] || { echo "::error::displayplacer found no screen"; exit 1; }
          displayplacer "id:$id res:1920x1080 hz:60 color_depth:7 enabled:true scaling:off origin:(0,0) degree:0"
      - uses: ./.github/actions/setup
      - name: PDF surface check
        run: scripts/macos/pdf-surface-check.sh
      - name: PDF surface check, with WebKit's PDF HUD on
        if: success() || failure()
        run: scripts/macos/pdf-surface-check.sh --hud-on
      - name: Window controls check
        if: success() || failure()
        run: scripts/macos/window-controls-check.sh
      - name: Drop check
        if: success() || failure()
        run: scripts/macos/drop-check.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surface-checks-macos
          path: e2e/screenshots-out/
          if-no-files-found: ignore

  draft:
    name: Draft the release
    if: github.event_name == 'push' && needs.review.outputs.path == 'build'
    needs: [review, ci, checks, linux-surface, windows-surface, macos-surface]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Write the checksums
        working-directory: packages
        run: |
          ls -l
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Keep the packages and checksums together
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: packages/
          if-no-files-found: error

      # The notes are .github/release-notes.md with the version, tag and commit
      # filled in as data, never as part of a program, and for a pre-release
      # the release-candidate note first (`release.mjs notes`). The file names
      # carry the app's version, the tag's without its suffix (#209).
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          node scripts/release.mjs notes "$version" --commit "$(git rev-parse 'HEAD^{commit}')" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release upload "$TAG" packages/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" packages/* --draft --verify-tag "${prerelease[@]}" \
              --title "HoploDex $version" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          fi

  # A final tag on a published release candidate's commit (RELEASING.md,
  # "Release candidates"): the release is that candidate's own files and
  # SHA256SUMS, built and tested by its own release run. They are checked
  # against its immutable, attested release, and nothing is built. Any problem
  # stops the job before the draft. Run by hand with `rehearse`, it does
  # everything but open the draft.
  promote:
    name: Promote the release candidate
    if: needs.review.outputs.path == 'promote'
    needs: [review, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0

      # `release.mjs promote-check`: a published, immutable pre-release with
      # exactly a release's files, each uploaded by a release run that passed
      # on this commit, and matching SHA256SUMS. Then GitHub's attestation of
      # each file.
      - name: Check the release candidate's files
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ needs.review.outputs.candidate }}
          COMMIT: ${{ needs.review.outputs.commit }}
          REHEARSAL: ${{ github.event_name != 'push' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RC" > "$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?event=push&status=success&branch=$RC&per_page=100" > "$RUNNER_TEMP/runs.json"
          gh release download "$RC" --dir "$RUNNER_TEMP/candidate" --repo "$GITHUB_REPOSITORY"
          rehearsal=()
          [[ "$REHEARSAL" == true ]] && rehearsal=(--rehearsal)
          node scripts/release.mjs promote-check "${RC#v}" --commit "$COMMIT" --release "$RUNNER_TEMP/release.json" \
            --runs "$RUNNER_TEMP/runs.json" --files "$RUNNER_TEMP/candidate" "${rehearsal[@]}"
          for f in "$RUNNER_TEMP"/candidate/*; do
            gh release verify-asset "$RC" "$f" --repo "$GITHUB_REPOSITORY"
          done
          echo "$RC's files passed every check." >> "$GITHUB_STEP_SUMMARY"

      - name: Open the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RC: ${{ needs.review.outputs.candidate }}
          COMMIT: ${{ needs.review.outputs.commit }}
        run: |
          version=${TAG#v}
          node scripts/release.mjs notes "$version" --commit "$COMMIT" --promoted-from "$RC" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release upload "$TAG" "$RUNNER_TEMP"/candidate/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RUNNER_TEMP"/candidate/* --draft --verify-tag \
              --title "HoploDex $version" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          fi
          echo "Drafted $TAG from $RC's files." >> "$GITHUB_STEP_SUMMARY"
