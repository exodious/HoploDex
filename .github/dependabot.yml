# Dependabot's version update pull requests are off: `open-pull-requests-limit: 0`
# on each entry below, and its security update pull requests are off in the
# repository's settings. Its pull requests can't meet HoploDex's pull request
# rules (the description's required sections, required reviews), so every pin
# now moves by hand: the workflows' actions, third-party ones pinned to a commit
# (#72) and GitHub's own to a release tag, and `builtin-baseline` in
# scripts/windows/vcpkg/vcpkg.json, which picks the OpenSSL the Windows jobs
# link (#25). Dependabot raises no alerts for a commit-pinned action or for
# vcpkg; `npm run audit:openssl` checks that OpenSSL against OpenSSL's
# advisories, and still fails when vcpkg offers a newer OpenSSL than the pin.
# npm and Cargo dependencies get Dependabot's security alerts and are updated
# by hand (docs/development/dependency-audit.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: vcpkg
    directory: /scripts/windows/vcpkg
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
