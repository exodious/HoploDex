# Dependabot version updates for the workflows' actions and the vcpkg pin.
# Third-party actions are pinned to a commit (#72), and Dependabot raises no
# alerts for a commit-pinned action, so these update pull requests are how a
# pin moves. GitHub's own actions, pinned to a release tag, are updated the
# same way. The vcpkg entry moves `builtin-baseline` in
# scripts/windows/vcpkg/vcpkg.json, which picks the OpenSSL the Windows jobs
# link (#25); Dependabot raises no security alerts for vcpkg either, so
# `npm run audit:openssl` checks that OpenSSL against OpenSSL's advisories.
# npm and Cargo dependencies get Dependabot's security alerts and are updated
# by hand (docs/development/dependency-audit.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: vcpkg
    directory: /scripts/windows/vcpkg
    schedule:
      interval: weekly
