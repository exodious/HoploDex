[package]
name = "hoplodex"
version = "0.1.0"
description = "Firearm Collection Inventory App"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"

[lib]
name = "hoplodex_lib"
# Only an rlib: the binary and the tests link it. The template's staticlib
# and cdylib are for iOS and Android, which HoploDex doesn't target, and each
# cost hundreds of megabytes in every debug build.
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "hoplodex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enabled for production/E2E builds so the app loads bundled frontendDist
# assets via Tauri's custom protocol instead of the devUrl dev server.
custom-protocol = ["tauri/custom-protocol"]
# Enabled for E2E builds and the keyring tests only. Swaps the OS-native
# keyring (Secret Service/Keychain/Credential Manager), which holds a
# database's passphrase only when the user asks this computer to remember
# it (FR-017), for keyring-core's in-memory mock store: a headless session
# can't answer the Secret Service's unlock prompt, and tests must never
# reach the developer's real keyring. `HOPLODEX_E2E_KEYRING=unavailable`
# makes it behave like a computer with no keyring (research.md §10).
mock-keyring = ["dep:keyring-core"]
# Enabled for E2E builds, and meant for everything that must never reach a
# shipped build: it implies `mock-keyring`; it compiles in the embedded
# WebDriver server the E2E suite drives the app through (main.rs, #29), which
# has no authentication and runs any script in the page; and
# `HOPLODEX_E2E_IDLE_MINUTE_SECONDS` then sets how long the idle lock counts
# as one minute, so a spec doesn't wait a real one (session/idle.rs).
# `scripts/check-no-webdriver.mjs` (in `npm run audit`, and on the release
# binary in build-appimage.sh) checks that a build without it has none of the
# server.
e2e = ["mock-keyring", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
# `unstable`: `Window::add_child`, the PDF preview's child web view
# (research.md §4). `macos-proxy`, macOS only (below): `proxy_url` there
# (research.md §6).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "chrono"] }
keyring = "4"
keyring-core = { version = "1", optional = true }
# The embedded W3C WebDriver server, E2E builds only (the `e2e` feature).
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
rust_xlsxwriter = "0.96"
calamine = "0.36"
csv = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
thiserror = "2"
chrono = "0.4"
getrandom = { version = "0.3", features = ["std"] }
log = "0.4"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
# Passphrase NFC normalization (research.md §1).
unicode-normalization = "0.1.25"
# The open marker's machine name (research.md §6).
gethostname = "1.1.0"
# Free space before a copy (research.md §4).
fs4 = "1.1.0"
# Promoted from transitive, at the version already in Cargo.lock: wiping
# passphrases from memory (research.md §1).
zeroize = "1.9"
# Document content checks, which only read directory structures and never
# decompress (research.md §2), text decoding (§12) and page PNGs (§11).
# Promoted from transitive, at the versions already in Cargo.lock: `zip` is
# the 8.x `calamine` uses, `png` the 0.17 `image` uses.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
cfb = "0.7.3"
encoding_rs = "0.8.35"
png = "0.17.16"
# TIFF pages, decoded in the render helper on every OS (research.md §11).
# `fax` is at 0.2, the one `tiff` uses, so the tree has a single copy.
tiff = "0.11.3"
fax = "0.2.7"

# Promoted from transitive, at the version already in Cargo.lock: asking the
# storage to discard a securely deleted file's blocks (research.md §12).
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# Sleep, wake, screen-lock and shutdown notices (research.md §14). Each is
# already in the tree for its platform; only the features are switched on.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.18"
# The render helper's confinement (research.md §11).
landlock = "0.4.7"
# The PDF surface's filter, settings and signals (research.md §6-§10). The
# version and features wry uses, `v2_40` on top of its `v2_38`.
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDistributedNotificationCenter",
    "NSError",
    "NSNotification",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSWorkspace"] }
# The PDF surface's content rule list, SPI switches and input (research.md
# §6, §7, §10). Promoted from dev-dependencies.
block2 = "0.6.2"
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKContentRuleList",
    "WKContentRuleListStore",
    "WKPreferences",
    "WKUserContentController",
    "WKWebView",
    "WKWebViewConfiguration",
] }
# `proxy_url` on macOS (research.md §6); macOS 14 and later, and the minimum
# is 26.
tauri = { version = "2", features = ["unstable", "macos-proxy"] }

[target.'cfg(windows)'.dependencies]
# File identity for the take-over check (research.md §6). Unix uses `stat`
# directly: opening a handle there would drop SQLite's locks when closed.
same-file = "1.0.6"
windows-sys = { version = "0.61", features = [
    # FSCTL_SET_ZERO_DATA after a secure delete (research.md §12).
    "Win32_Foundation",
    # The hidden window that receives power and session messages.
    "Win32_Graphics_Gdi",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_UI_WindowsAndMessaging",
    # `GetLastInputInfo`, sampled for the idle lock while the PDF surface is
    # up (research.md §10).
    "Win32_UI_Input_KeyboardAndMouse",
    # The render helper's job object and mitigations (research.md §11), the
    # external copy's DACL (§18) and `GetLastInputInfo` (§10).
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # The helper's error mode, parent watch and WER flags, and the mitigation
    # policy structures (research.md §11).
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ErrorReporting",
    "Win32_System_SystemServices",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_SystemInformation",
    # The pipes of the render helper HoploDex starts into its job object
    # (research.md §11, amended 2026-10-07).
    "Win32_System_Pipes",
] }
# The PDF surface's settings and events (research.md §6-§10). The versions
# wry uses.
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

# Distributed notices arrive on the main thread's run loop, and libtest runs
# each test on a thread of its own, so this one has its own `main`.
[[test]]
name = "macos_screen_lock_test"
harness = false

# WinSock, for the tripwire's exclusive bind (research.md §6).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Networking_WinSock",
    # The helper lookup of tests/support/preview_support.rs.
    "Win32_System_Diagnostics_ToolHelp",
    # Waiting for the helper to end when its parent is killed
    # (tests/tiff_helper_test.rs).
    "Win32_System_Threading",
] }

# Debug and test builds keep line tables, so panics and backtraces still name
# the file and line, but not full debug info, and none for dependencies. Full
# debug info made each of the ~60 test programs 140-260 MB (a .pdb on Windows,
# inside the executable on Linux). For a debugging session, set
# CARGO_PROFILE_DEV_DEBUG=true to get full debug info for HoploDex's own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# E2E builds (`cargo build --profile e2e`): the release profile without fat
# LTO and its single codegen unit, so a backend change relinks in seconds
# rather than a minute. Keeps `panic = "abort"`, so a panic behaves as in the
# shipped app. Set HOPLODEX_E2E_PROFILE=release to drive the shipping profile
# instead (DEVELOPMENT.md, "Test").
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
