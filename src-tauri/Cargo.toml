[package]
name = "hoplodex"
version = "0.1.0"
description = "Firearm Collection Inventory App"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-only"

[lib]
name = "hoplodex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "hoplodex"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enabled for production/E2E builds so the app loads bundled frontendDist
# assets via Tauri's custom protocol instead of the devUrl dev server.
custom-protocol = ["tauri/custom-protocol"]
# Enabled for E2E builds only. Swaps the OS-native keyring (Secret
# Service/Keychain/Credential Manager) for keyring-core's in-memory mock
# store, so the SQLCipher passphrase never depends on a real, unlockable
# platform credential store — headless/CI environments have no way to
# answer the Secret Service's unlock prompt (research.md §5 already
# assumes the real store is silently unlocked via the user's login
# session, which doesn't hold in CI).
mock-keyring = ["dep:keyring-core"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "chrono"] }
keyring = "4"
keyring-core = { version = "1", optional = true }
rust_xlsxwriter = "0.96"
calamine = "0.36"
csv = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
thiserror = "2"
chrono = "0.4"
getrandom = { version = "0.3", features = ["std"] }
log = "0.4"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
# Passphrase NFC normalization (research.md §1).
unicode-normalization = "0.1.25"
# The open marker's machine name (research.md §6).
gethostname = "1.1.0"
# Free space before a copy (research.md §4).
fs4 = "1.1.0"
# Promoted from transitive, at the version already in Cargo.lock: wiping
# passphrases from memory (research.md §1).
zeroize = "1.9"

# Sleep, wake, screen-lock and shutdown notices (research.md §14). Each is
# already in the tree for its platform; only the features are switched on.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# File identity for the take-over check (research.md §6). Unix uses `stat`
# directly: opening a handle there would drop SQLite's locks when closed.
same-file = "1.0.6"
windows-sys = { version = "0.61", features = [
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
