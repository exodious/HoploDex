# Rust dependency audit, two checks:
# - `npm run audit:cargo` (cargo deny check advisories, against the RustSec
#   advisory database). See "Dependency audit" in DEVELOPMENT.md for the
#   policy and for how to add an exception.
# - `npm run audit:licenses` (cargo deny check licenses, alongside the npm
#   check). See "License audit" in DEVELOPMENT.md.
#
# The bans and sources checks aren't used.
#
# Advisories: any vulnerability advisory fails the
# audit, whatever its severity: many RustSec advisories carry no CVSS score, so
# an unscored one is treated as high. Unmaintained and unsound notices fail it
# too, so each gets a decision here rather than going unnoticed.
#
# Every ignore entry needs a `reason`. For a vulnerability, write the analysis
# in a comment above the entry: why it can't be fixed yet, how it does or
# doesn't reach HoploDex, and a date to look at it again.

[graph]
# Include the mock-keyring (E2E) and custom-protocol builds.
all-features = true

[advisories]
unmaintained = "all"
# cargo-deny checks only the workspace's own crates for unsound notices
# unless told otherwise, which let a dependency's through.
unsound = "all"
ignore = [
    # glib 0.18: `VariantStrIter`'s iterator reads a string pointer the C call
    # never wrote back, so it can dereference NULL (RUSTSEC-2024-0429).
    #
    # No fix for 0.18: glib 0.20 has it, but Tauri's Linux backend (gtk,
    # webkit2gtk, tao, wry, muda) is on gtk-rs 0.18. The glib 0.21 in the
    # tree is a different, patched version.
    #
    # Not reachable. The only way in is `glib::Variant::array_iter_str()`,
    # and nothing calls it: not HoploDex (src/, build.rs), not the vendored
    # WebDriver plugin, and not any of the 22 other crates that depend on
    # glib 0.18 (only glib's own tests do). Checked 2026-10-09 at glib 0.18.5.
    #
    # Review by 2026-12-31, or sooner if Tauri moves off gtk-rs 0.18.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter: unsound, not reachable (array_iter_str is never called), via gtk-rs 0.18 in Tauri" },
    # Compile-time proc macro pulled in by the gtk-rs 0.18 macros
    # (glib-macros, gtk3-macros) under Tauri's Linux backend; it isn't in the
    # built binary. Goes when Tauri moves off gtk-rs 0.18.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, compile-time only, via gtk-rs 0.18 in Tauri" },
    # The unic-* crates come in through urlpattern in tauri-utils (Tauri's
    # URL pattern matching for capabilities). Unmaintained, no known
    # vulnerability. Goes when tauri-utils replaces urlpattern 0.3.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: unmaintained, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: unmaintained, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: unmaintained, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: unmaintained, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: unmaintained, via urlpattern in tauri-utils" },
    # zip 7.2 and 8.6: extracting an archive to disk keeps SUID/SGID bits
    # (RUSTSEC-2026-0367), writes symlinks that point outside the destination
    # (RUSTSEC-2026-0368), and applies permissions through them
    # (RUSTSEC-2026-0369). All three are high; each is fixed in zip 9.
    #
    # No fix to take yet: the newest calamine (0.36.1) requires zip ^8.6 and
    # the newest rust_xlsxwriter (0.99.1) ^8.3 (0.96 here requires ^7.2), and
    # HoploDex's own zip dependency is the 8.x calamine uses.
    #
    # Not reachable. Every advisory is in the extract-to-disk API
    # (`ZipArchive::extract`, `ZipStreamReader::extract`), and nothing calls
    # it: HoploDex only reads entries in memory (import_reader/reader.rs,
    # document_types.rs), calamine reads entries, and rust_xlsxwriter only
    # writes. HoploDex never runs privileged either. Checked 2026-10-17 at
    # calamine 0.36.0 and rust_xlsxwriter 0.96.0.
    #
    # Review by 2026-11-30, or as soon as calamine and rust_xlsxwriter accept
    # zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip <9 extract keeps SUID/SGID: extract is never called; calamine and rust_xlsxwriter don't accept zip 9 yet" },
    { id = "RUSTSEC-2026-0368", reason = "zip <9 extract writes symlinks outside the destination: extract is never called; calamine and rust_xlsxwriter don't accept zip 9 yet" },
    { id = "RUSTSEC-2026-0369", reason = "zip <9 extract applies permissions through symlinks: extract is never called; calamine and rust_xlsxwriter don't accept zip 9 yet" },
    # zbus_names, zvariant and zvariant_derive were merged into zbus 6.0 and
    # are no longer maintained as separate crates (RUSTSEC-2026-0370 to
    # RUSTSEC-2026-0372, published after the last audit run). Unmaintained
    # notices, no known vulnerability.
    #
    # No fix to take yet: zbus 6.0.0 exists, but the tree's zbus 5.18 is also
    # required by secret-service 5.1 (through keyring's Linux store) and
    # tauri-plugin-opener 2.5, which a bump of HoploDex's own `zbus`
    # dependency would not remove, so the three crates stay in the lock file.
    #
    # Linux only (HoploDex's `platform/linux.rs`, the keyring's Secret Service
    # and the opener plugin's D-Bus calls); macOS and Windows builds don't
    # link them. The advisory is about maintenance, not about code
    # HoploDex reaches in a harmful way. Checked 2026-10-17 at zbus 5.18.0.
    #
    # Review by 2027-01-31, or as soon as secret-service and
    # tauri-plugin-opener accept zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, merged into zbus 6; secret-service and tauri-plugin-opener still use zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, merged into zbus 6; secret-service and tauri-plugin-opener still use zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, merged into zbus 6; secret-service and tauri-plugin-opener still use zbus 5" },
]

# License audit. HoploDex is released under GPL-3.0-only, so every crate
# linked into it needs a license expression satisfiable from this list of
# GPLv3-compatible licenses. Keep the list in step with ALLOWED in
# scripts/check-npm-licenses.mjs. Before adding a license, check it against
# the FSF's list of GPL-compatible licenses
# (https://www.gnu.org/licenses/license-list.html). Apache-2.0 is fine for
# GPLv3 (not GPLv2). MPL-2.0 is fine unless a file carries the Exhibit B
# "Incompatible With Secondary Licenses" notice, which cargo-deny can't see:
# grep a new MPL-2.0 crate's sources for it.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The list is the compatibility policy, not an inventory of what's in use.
unused-allowed-license = "allow"
confidence-threshold = 0.93
