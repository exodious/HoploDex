# Rust dependency audit, two checks:
# - `npm run audit:cargo` (cargo deny check advisories, against the RustSec
#   advisory database). See docs/development/dependency-audit.md for the
#   policy and for how to add an exception.
# - `npm run audit:licenses` (cargo deny check licenses, alongside the npm
#   check). See docs/development/licenses.md.
#
# The bans and sources checks aren't used.
#
# Three separate rules (yanked crates have no exception form):
#
# 1. Advisories (vulnerabilities): any advisory fails the audit, whatever its
#    severity: many RustSec advisories carry no CVSS score, so an unscored one
#    is treated as high. Unsound notices fail it too.
# 2. Unmaintained crates fail it as well, so each gets a decision here. An
#    exception's comment says whether the crate is direct (a dependency of
#    HoploDex itself) or indirect. An indirect one names its parent. A direct
#    one is excepted only in a special circumstance, which the comment states
#    (012 FR-019).
# 3. Yanked crates always fail, shipped or build-only, and are never excepted:
#    update the crate. This is not a kind of deprecation (012 FR-014).
#    cargo-deny reads yank state from cargo's index cache without refreshing
#    it, so audit:cargo refreshes it first (docs/development/dependency-audit.md, "Yanked crates").
#
# Every ignore entry needs a `reason`. For a vulnerability, write the analysis
# in a comment above the entry: why it can't be fixed yet, how it does or
# doesn't reach HoploDex, and a date to look at it again.

[graph]
# Include the mock-keyring (E2E) and custom-protocol builds.
all-features = true

[advisories]
# A yanked crate version always fails, shipped or build-only, and is never
# excepted: never add a `crate@version` entry to `ignore` for one. Update it
# (012 FR-014).
yanked = "deny"
unmaintained = "all"
# cargo-deny checks only the workspace's own crates for unsound notices
# unless told otherwise, which let a dependency's through.
unsound = "all"
ignore = [
    # glib 0.18: `VariantStrIter`'s iterator reads a string pointer the C call
    # never wrote back, so it can dereference NULL (RUSTSEC-2024-0429).
    #
    # No fix for 0.18: glib 0.20 has it, but Tauri's Linux backend (gtk,
    # webkit2gtk, tao, wry, muda) is on gtk-rs 0.18. The glib 0.21 in the
    # tree is a different, patched version.
    #
    # Not reachable. The only way in is `glib::Variant::array_iter_str()`,
    # and nothing calls it: not HoploDex (src/, build.rs), not the vendored
    # WebDriver plugin, and not any of the 22 other crates that depend on
    # glib 0.18 (only glib's own tests do). Checked 2026-10-09 at glib 0.18.5.
    #
    # Review by 2026-12-31, or sooner if Tauri moves off gtk-rs 0.18.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter: unsound, not reachable (array_iter_str is never called), via gtk-rs 0.18 in Tauri" },
    # Compile-time proc macro pulled in by the gtk-rs 0.18 macros
    # (glib-macros, gtk3-macros) under Tauri's Linux backend; it isn't in the
    # built binary. Indirect, via gtk-rs 0.18's macros in Tauri.
    #
    # Review by 2027-01-31, or sooner if Tauri moves off gtk-rs 0.18, which
    # removes it.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, compile-time only, via gtk-rs 0.18 in Tauri" },
    # The unic-* crates come in through urlpattern in tauri-utils (Tauri's
    # URL pattern matching for capabilities). Unmaintained, no known
    # vulnerability. Indirect, via urlpattern in tauri-utils.
    #
    # Review by 2027-01-31, or sooner if tauri-utils replaces urlpattern 0.3,
    # which removes them.
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range: unmaintained, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0080", reason = "unic-common: unmaintained, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property: unmaintained, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: unmaintained, via urlpattern in tauri-utils" },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: unmaintained, via urlpattern in tauri-utils" },
    # zbus_names, zvariant and zvariant_derive were merged into zbus 6.0 and
    # are no longer maintained as separate crates (RUSTSEC-2026-0370 to
    # RUSTSEC-2026-0372, published after the last audit run). Unmaintained
    # notices, no known vulnerability.
    #
    # No fix to take yet: zbus 6.0.0 exists, but the tree's zbus 5.18 is also
    # required by secret-service 5.1 (through keyring's Linux store) and
    # tauri-plugin-opener 2.5, which a bump of HoploDex's own `zbus`
    # dependency would not remove, so the three crates stay in the lock file.
    #
    # Linux only (HoploDex's `platform/linux.rs`, the keyring's Secret Service
    # and the opener plugin's D-Bus calls); macOS and Windows builds don't
    # link them. The advisory is about maintenance, not about code
    # HoploDex reaches in a harmful way. Indirect, via zbus 5, which
    # secret-service and tauri-plugin-opener require. Checked 2026-10-17 at
    # zbus 5.18.0.
    #
    # Review by 2027-01-31, or as soon as secret-service and
    # tauri-plugin-opener accept zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, merged into zbus 6; secret-service and tauri-plugin-opener still use zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, merged into zbus 6; secret-service and tauri-plugin-opener still use zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, merged into zbus 6; secret-service and tauri-plugin-opener still use zbus 5" },
    # chrono is unmaintained (RUSTSEC-2026-0543); all versions are affected
    # and there is no release to move to. An unmaintained notice: no known
    # vulnerability.
    #
    # HoploDex uses it directly, and through rusqlite's `chrono` feature and
    # zxcvbn 3.1, so dropping HoploDex's own use wouldn't remove it either.
    # Moving off it, to jiff or time, is #197. Checked 2026-11-18 at
    # chrono 0.4.45.
    #
    # Review by 2027-01-17.
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, no known vulnerability; direct, via rusqlite's chrono feature and zxcvbn" },
    # SQLite before 3.54.0 can return uninitialized page-cache memory when it
    # opens a database file with a sibling `-wal` file whose page size differs
    # from the database's (RUSTSEC-2026-0459, CVE-2026-119375). HoploDex
    # builds SQLCipher from source (rusqlite's `bundled-sqlcipher`).
    #
    # No fix to take yet: libsqlite3-sys 0.39 (rusqlite 0.41) bundles SQLite
    # 3.54 only for its plain `bundled` build. Its `bundled-sqlcipher` build
    # takes sqlcipher-src =419.0.6, which bundles SQLite 3.53.4, and there is
    # no SQLCipher release on SQLite 3.54 yet.
    #
    # Exposure needs a database file and its `-wal`, both written by a less
    # trusted party, such as a collection or backup from elsewhere. HoploDex
    # opens the databases the user creates or picks with Open… (and their
    # recent list), and a restore checks a copy it makes of the chosen backup
    # file. It never puts a database in WAL mode itself, but that doesn't keep
    # a `-wal` out: SQLite opens one it finds beside a database whatever the
    # journal mode (`pagerOpenWalIfPresent`). SQLCipher decrypts and checks
    # the HMAC of every page it reads, from the database or a `-wal` frame,
    # with the database's key (`readDbPage`), so such a pair would have to come
    # from someone who also knows its passphrase, and the user would have to
    # open it with that passphrase. Checked 2026-11-19 in libsqlite3-sys
    # 0.38.1's bundled sqlite3.c.
    #
    # Review by 2026-12-17, or sooner if a SQLCipher release on SQLite 3.54
    # reaches libsqlite3-sys's `bundled-sqlcipher`.
    { id = "RUSTSEC-2026-0459", reason = "bundled SQLite in SQLCipher before 3.54: no SQLCipher build with the fix yet; needs a database and its -wal from a less trusted party, opened with its passphrase" },
]

# License audit. HoploDex is released under GPL-3.0-only, so every crate
# linked into it needs a license expression satisfiable from this list of
# GPLv3-compatible licenses. Keep the list in step with ALLOWED in
# scripts/licenses/policy.mjs (scripts/licenses/policy.test.ts fails when the
# two differ). Before adding a license, check it against
# the FSF's list of GPL-compatible licenses
# (https://www.gnu.org/licenses/license-list.html). Apache-2.0 is fine for
# GPLv3 (not GPLv2). MPL-2.0 is fine unless a file carries the Exhibit B
# "Incompatible With Secondary Licenses" notice, which cargo-deny can't see:
# grep a new MPL-2.0 crate's sources for it.
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The list is the compatibility policy, not an inventory of what's in use.
unused-allowed-license = "allow"
confidence-threshold = 0.93
