# A fixture check manifest: manifest-valid derived as 011 data-model.md "The check manifest" says.
id: io.github.exodious.HoploDex
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node24
command: hoplodex
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.ScreenSaver
  - --system-talk-name=org.freedesktop.login1
  - --share=network
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node24/bin
  env:
    CARGO_HOME: /run/build/hoplodex/cargo
    CARGO_NET_OFFLINE: "true"
    npm_config_offline: "true"
modules:
  - name: hoplodex
    buildsystem: simple
    build-commands:
      - npm ci --offline
      - npm run build
      - cd src-tauri && cargo build --profile e2e --offline --locked --features custom-protocol,e2e --bin hoplodex
      - install -Dm755 src-tauri/target/e2e/hoplodex /app/bin/hoplodex
    sources:
      - type: dir
        path: ..
      - cargo-sources.json
      - node-sources.json
